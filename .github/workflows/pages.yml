name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/maryam-portfolio-build-7o1fwe
  workflow_dispatch:

# Allow the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; don't cancel a run that's mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A project site is served from /<repo>/, so the build needs that
      # prefix. A repo named <user>.github.io is served from the root, and so
      # is a custom domain on Pages — public/CNAME is the marker for that.
      # The domain is served by Netlify instead, which builds from the root
      # with no BASE_PATH at all, so no CNAME lives here and this site keeps
      # its /<repo>/ prefix.
      - name: Work out the base path
        id: base
        run: |
          REPO="${{ github.event.repository.name }}"
          if [[ -f public/CNAME ]]; then
            echo "path=/" >> "$GITHUB_OUTPUT"
            echo "Custom domain $(cat public/CNAME) — serving from the root."
          elif [[ "$REPO" == *.github.io ]]; then
            echo "path=/" >> "$GITHUB_OUTPUT"
          else
            echo "path=/$REPO/" >> "$GITHUB_OUTPUT"
          fi

      - run: npm run build
        env:
          BASE_PATH: ${{ steps.base.outputs.path }}

      # Without this, Pages runs Jekyll and drops files beginning with "_".
      - run: touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
